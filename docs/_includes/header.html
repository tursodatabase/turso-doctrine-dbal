<header class="site-header">
    <div class="header-inner">
        <button class="icon-button sidebar-toggle" data-sidebar-toggle aria-label="Toggle navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>

        <a class="brand" href="{{ site.baseurl }}/">
            <span class="brand__mark"><img src="{{ '/images/turso-doctrine-dbal-logo.png' | relative_url }}" alt="" width="20" height="20"></span>
            <span>{{ site.title }}</span>
        </a>

        <nav class="header-nav" aria-label="Primary">
            <a href="{{ site.baseurl }}/">Home</a>
            <a href="{{ site.baseurl }}/user-manual/" {% if page.url contains '/user-manual' %}aria-current="page"{% endif %}>User manual</a>
            <a href="https://github.com/tursodatabase/turso-doctrine-dbal" target="_blank" rel="noopener">GitHub</a>
        </nav>

        <div class="header-actions">
            <button class="icon-button" data-theme-toggle aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
            </button>
        </div>
    </div>
</header>
